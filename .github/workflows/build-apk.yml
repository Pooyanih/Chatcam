name: Build Reaction Recorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Reaction Recorder project
        run: |
          mkdir -p project
          unzip -q ReactionRecorderV7.zip -d project

          # Handle the case where the ZIP contains one top-level folder.
          if [ -d "project/ReactionRecorderV7" ]; then
            mv project/ReactionRecorderV7/* project/
            shopt -s dotglob
            mv project/ReactionRecorderV7/.* project/ 2>/dev/null || true
            rmdir project/ReactionRecorderV7
          fi

      - name: Check project
        working-directory: project
        run: |
          echo "Project contents:"
          find . -maxdepth 3 -type f | sort

      - name: Build debug APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        working-directory: project
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReactionRecorderV7-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
